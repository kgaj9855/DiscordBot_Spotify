apiVersion: apps/v1
kind: Deployment

metadata:
  name: discord-bot

spec:
  replicas: 1

  selector:
    matchLabels:
      app: discord-bot

  template:
    metadata:
      labels:
        app: discord-bot

    spec:
      containers:
        - name: discord-bot

          # CI/CD 部署時會用 kubectl set image 更新這個版本
          image: ken900809/discord-bot:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: discord-bot-secret

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/spotify
            - name: SPRING_DATASOURCE_USERNAME
              value: karta40213
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
