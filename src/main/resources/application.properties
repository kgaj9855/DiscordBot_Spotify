spring.ai.mcp.server.name=spotify
spring.ai.mcp.server.version=1.0.0

spring.ai.mcp.server.protocol=STREAMABLE

spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# 可直接沿用 .env 的 JDA_API；正式部署建議透過環境變數提供。
spring.config.import=optional:file:.env[.properties]
discord.bot.enabled=${DISCORD_BOT_ENABLED:false}
discord.bot.token=${JDA_API:}
discord.owner-id=${DISCORD_OWNER_ID:}
discord.guild-id=${DISCORD_GUILD_ID:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spotify}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:karta40213}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spotify.api.base-url=${SPOTIFY_API_BASE_URL:https://api.spotify.com/v1}
spotify.api.connect-timeout=5s
spotify.api.response-timeout=10s
