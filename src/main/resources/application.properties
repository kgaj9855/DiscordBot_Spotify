spring.ai.mcp.server.name=spotify
spring.ai.mcp.server.version=1.0.0

spring.ai.mcp.server.protocol=STREAMABLE

spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# 可直接沿用 .env 的 JDA_API；正式部署建議透過環境變數提供。
spring.config.import=optional:file:.env[.properties]
discord.bot.enabled=${DISCORD_BOT_ENABLED:false}
discord.bot.token=${JDA_API:}
discord.owner-id=${DISCORD_OWNER_ID:}
discord.guild-id=${DISCORD_GUILD_ID:}
