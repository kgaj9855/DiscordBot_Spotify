name: Self Hosted Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check runner
        run: |
          whoami
          hostname
          docker --version
          minikube kubectl -- version --client
          minikube status

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/discord-bot:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/discord-bot:latest

      - name: Deploy to Kubernetes
        run: |
          minikube kubectl -- apply -f deployment.yaml

          minikube kubectl -- set image deployment/discord-bot \
            discord-bot=${{ secrets.DOCKER_USERNAME }}/discord-bot:latest

          minikube kubectl -- rollout status deployment/discord-bot