name: Self Hosted Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check runner
        run: |
          whoami
          hostname
          docker --version
          minikube kubectl -- version --client
          minikube status

      - name: Check Docker secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME is empty"
            exit 1
          fi

          if [ -z "$DOCKER_TOKEN" ]; then
            echo "DOCKER_TOKEN is empty"
            exit 1
          fi

          echo "Docker secrets are available"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/discord-bot:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/discord-bot:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/discord-bot:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/discord-bot:latest

      - name: Validate Kubernetes YAML
        run: |
          minikube kubectl -- apply --dry-run=client -f k8s/deployment.yaml
          minikube kubectl -- apply --dry-run=client -f k8s/service.yaml
          minikube kubectl -- apply --dry-run=client -f k8s/gateway.yaml
          minikube kubectl -- apply --dry-run=client -f k8s/virtual-service.yaml

      - name: Check Istio
        run: |
          minikube kubectl -- get pods -n istio-system
          minikube kubectl -- get service istio-ingressgateway -n istio-system

      - name: Create or update TLS Secret
        env:
          DISCORD_TLS_CRT: ${{ secrets.DISCORD_TLS_CRT }}
          DISCORD_TLS_KEY: ${{ secrets.DISCORD_TLS_KEY }}
        run: |
          if [ -z "$DISCORD_TLS_CRT" ]; then
            echo "DISCORD_TLS_CRT is empty"
            exit 1
          fi

          if [ -z "$DISCORD_TLS_KEY" ]; then
            echo "DISCORD_TLS_KEY is empty"
            exit 1
          fi

          printf '%s\n' "$DISCORD_TLS_CRT" > /tmp/discord.crt
          printf '%s\n' "$DISCORD_TLS_KEY" > /tmp/discord.key

          minikube kubectl -- create secret tls discord-tls \
            -n istio-system \
            --cert=/tmp/discord.crt \
            --key=/tmp/discord.key \
            --dry-run=client -o yaml \
            | minikube kubectl -- apply -f -

          rm -f /tmp/discord.crt /tmp/discord.key

      - name: Check TLS Secret
        run: |
          minikube kubectl -- get secret discord-tls -n istio-system

      - name: Deploy to Kubernetes
        run: |
          # 建立 / 更新 Service
          minikube kubectl -- apply -f k8s/service.yaml

          # 建立 / 更新 Istio Gateway
          minikube kubectl -- apply -f k8s/gateway.yaml

          # 建立 / 更新 Istio VirtualService
          minikube kubectl -- apply -f k8s/virtual-service.yaml

          # 建立 / 更新 Deployment
          minikube kubectl -- apply -f k8s/deployment.yaml

          # 更新 Deployment 使用這次 commit 建立的 image
          minikube kubectl -- set image deployment/discord-bot \
            discord-bot=${{ secrets.DOCKER_USERNAME }}/discord-bot:${{ github.sha }}

          # 等待 Deployment 更新完成
          minikube kubectl -- rollout status deployment/discord-bot --timeout=180s

      - name: Check deployment
        run: |
          echo "=== Deployments ==="
          minikube kubectl -- get deployments

          echo "=== Pods ==="
          minikube kubectl -- get pods

          echo "=== Services ==="
          minikube kubectl -- get services

          echo "=== Discord Bot Service ==="
          minikube kubectl -- get service discord-bot-service

          echo "=== Istio Gateway ==="
          minikube kubectl -- get gateway

          echo "=== Istio VirtualService ==="
          minikube kubectl -- get virtualservice

          echo "=== Istio Ingress Gateway ==="
          minikube kubectl -- get service istio-ingressgateway -n istio-system

          echo "=== TLS Secret ==="
          minikube kubectl -- get secret discord-tls -n istio-system

          echo "=== Current deployed image ==="
          minikube kubectl -- get deployment discord-bot \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

