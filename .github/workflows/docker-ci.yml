name: Self Hosted Docker Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check runner
        run: |
          whoami
          hostname
          docker --version
          docker ps

      - name: Build Docker image
        run: docker build -t discord-bot .
